<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<!--
  The code editor that tools/video/studio.js records for code videos (kind: code): one Rust file, typed live,
  zoomed in so about fifteen lines fill the frame, with a run panel that shows the program's real output.
  studio.js drives it through window.__ed: fit(cols) · set(text) · to(text, { cps, paste }) · select(text, nth) · unselect() · run(cmd, out, ok) · close()
  · side(src, width) (the chapter page's machine in a panel on the left, the editor narrowed to the rest; side(null) closes it).
  ?board opens it empty, as the backdrop for board videos.
-->
<style>
:root {
  --bg: #2b2b2b; --gutter: #313335; --line-no: #606366; --line-no-on: #a4a3a3; --text: #a9b7c6; --caret: #bbbbbb;
  --cur: #323232; --sel: #214283; --kw: #cc7832; --str: #6a8759; --num: #6897bb; --cm: #808080; --fn: #ffc66d;
  --mac: #4eade5; --ty: #b5b6e3; --lt: #20999d; --attr: #bbb529; --tab: #3c3f41; --tab-on: #4e5254; --accent: #4a88c7;
  --font: 40px; --lh: 64px; --cw: 24px;
}
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; cursor: none; }
body { font-family: 'JetBrains Mono', Menlo, monospace; color: var(--text); display: flex; flex-direction: column; font-variant-ligatures: none; } /* <= stays <=: beginners type what they see */
#tabs { height: 66px; flex: none; background: var(--tab); display: flex; align-items: stretch; border-bottom: 1px solid #2b2b2b; }
.tab { display: flex; align-items: center; gap: 14px; padding: 0 30px 0 24px; font: 400 27px 'JetBrains Mono', Menlo, monospace; color: #bbbbbb; background: var(--tab-on); border-bottom: 4px solid var(--accent); }
.tab .ic { width: 34px; height: 34px; flex: none; } /* the Rust logo (tools/video/rust-logo.svg), in front of a .rs file's name */
.tab .ic[hidden] { display: none; }
.tab .ic svg { display: block; width: 100%; height: 100%; fill: #f74c00; }
.tab .x { color: #6e6e6e; font-size: 24px; margin-left: 10px; }
#main { position: relative; flex: 1; overflow: hidden; }
#gutter { position: absolute; left: 0; top: 0; bottom: 0; width: 132px; background: var(--bg); border-right: 1px solid #3a3a3a; }
#view { position: absolute; left: 0; right: 0; top: 0; bottom: 0; overflow: hidden; }
#content { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.ln { position: relative; height: var(--lh); line-height: var(--lh); font-size: var(--font); white-space: pre; }
.ln.on { background: var(--cur); }
.ln .no { position: absolute; left: 0; width: 100px; text-align: right; color: var(--line-no); }
.ln.on .no { color: var(--line-no-on); }
.ln .tx { position: absolute; left: var(--left, 160px); }
.sel { position: absolute; background: var(--sel); height: var(--lh); }
#caret { position: absolute; width: 3px; height: 50px; background: var(--caret); margin-top: 7px; }
#caret.blink { animation: blink 1.06s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.kw { color: var(--kw); } .str { color: var(--str); } .num { color: var(--num); } .cm { color: var(--cm); }
.fn { color: var(--fn); } .mac { color: var(--mac); } .ty { color: var(--ty); } .lt { color: var(--lt); } .attr { color: var(--attr); }
#run { flex: none; height: 0; overflow: hidden; background: var(--bg); border-top: 2px solid #3c3f41; transition: height .32s ease; }
#run.open { height: 330px; } #run.open.tall { height: 600px; } #run.tall pre { font-size: 26px; }
#run .head { height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 22px; background: var(--tab); font-size: 24px; color: #bbbbbb; }
#run .head .play { color: #59a869; font-size: 22px; }
#run pre { height: calc(100% - 52px); box-sizing: border-box; overflow: hidden; margin: 0; padding: 14px 30px; font: 400 32px/1.45 'JetBrains Mono', Menlo, monospace; color: var(--text); white-space: pre-wrap; }
#run pre { font-variant-ligatures: none; } /* the font shorthand above resets it: >= stays >= */
#run .dim { color: var(--cm); } #run .err { color: #ff6b68; } #run .warn { color: #e0c46c; }
body.board #tabs, body.board #main, body.board #run { visibility: hidden; }
/* a side panel ({side <scene>} in studio.js): the chapter page's machine on the left, the editor in the rest of the frame */
body.side { box-sizing: border-box; }
body.side .ln .no { width: 78px; }
#side { position: fixed; left: 0; top: 0; height: 100vh; border: 0; z-index: 1; background: #0d1220; box-shadow: 1px 0 0 #3c3f41; }
body.board { background: #0d1220; }
/* a YouTube Short (1080×1920): the editor sits between the player's top bar and the burned-in captions, clear of the bottom fifth */
body.short { box-sizing: border-box; padding: 244px 0 690px; }
body.short .ln .no { width: 64px; } body.short #caret.blink { animation: none; } /* a short: a steady caret, so an idle editor isn't flickering */
body.short #run.open { height: 216px; } body.short #run:not(.open) { height: 0 !important; } body.short #run pre { font-size: 28px; padding: 10px 24px; } body.short #run .head { height: 46px; font-size: 22px; }
</style>
</head>
<body>
<div id="tabs"><div class="tab"><span class="ic" id="ficon"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M23.8346 11.7033l-1.0073-.6236a13.7268 13.7268 0 00-.0283-.2936l.8656-.8069a.3483.3483 0 00-.1154-.578l-1.1066-.414a8.4958 8.4958 0 00-.087-.2856l.6904-.9587a.3462.3462 0 00-.2257-.5446l-1.1663-.1894a9.3574 9.3574 0 00-.1407-.2622l.49-1.0761a.3437.3437 0 00-.0274-.3361.3486.3486 0 00-.3006-.154l-1.1845.0416a6.7444 6.7444 0 00-.1873-.2268l.2723-1.153a.3472.3472 0 00-.417-.4172l-1.1532.2724a14.0183 14.0183 0 00-.2278-.1873l.0415-1.1845a.3442.3442 0 00-.49-.328l-1.076.491c-.0872-.0476-.1742-.0952-.2623-.1407l-.1903-1.1673A.3483.3483 0 0016.256.955l-.9597.6905a8.4867 8.4867 0 00-.2855-.086l-.414-1.1066a.3483.3483 0 00-.5781-.1154l-.8069.8666a9.2936 9.2936 0 00-.2936-.0284L12.2946.1683a.3462.3462 0 00-.5892 0l-.6236 1.0073a13.7383 13.7383 0 00-.2936.0284L9.9803.3374a.3462.3462 0 00-.578.1154l-.4141 1.1065c-.0962.0274-.1903.0567-.2855.086L7.744.955a.3483.3483 0 00-.5447.2258L7.009 2.348a9.3574 9.3574 0 00-.2622.1407l-1.0762-.491a.3462.3462 0 00-.49.328l.0416 1.1845a7.9826 7.9826 0 00-.2278.1873L3.8413 3.425a.3472.3472 0 00-.4171.4171l.2713 1.1531c-.0628.075-.1255.1509-.1863.2268l-1.1845-.0415a.3462.3462 0 00-.328.49l.491 1.0761a9.167 9.167 0 00-.1407.2622l-1.1662.1894a.3483.3483 0 00-.2258.5446l.6904.9587a13.303 13.303 0 00-.087.2855l-1.1065.414a.3483.3483 0 00-.1155.5781l.8656.807a9.2936 9.2936 0 00-.0283.2935l-1.0073.6236a.3442.3442 0 000 .5892l1.0073.6236c.008.0982.0182.1964.0283.2936l-.8656.8079a.3462.3462 0 00.1155.578l1.1065.4141c.0273.0962.0567.1914.087.2855l-.6904.9587a.3452.3452 0 00.2268.5447l1.1662.1893c.0456.088.0922.1751.1408.2622l-.491 1.0762a.3462.3462 0 00.328.49l1.1834-.0415c.0618.0769.1235.1528.1873.2277l-.2713 1.1541a.3462.3462 0 00.4171.4161l1.153-.2713c.075.0638.151.1255.2279.1863l-.0415 1.1845a.3442.3442 0 00.49.327l1.0761-.49c.087.0486.1741.0951.2622.1407l.1903 1.1662a.3483.3483 0 00.5447.2268l.9587-.6904a9.299 9.299 0 00.2855.087l.414 1.1066a.3452.3452 0 00.5781.1154l.8079-.8656c.0972.0111.1954.0203.2936.0294l.6236 1.0073a.3472.3472 0 00.5892 0l.6236-1.0073c.0982-.0091.1964-.0183.2936-.0294l.8069.8656a.3483.3483 0 00.578-.1154l.4141-1.1066a8.4626 8.4626 0 00.2855-.087l.9587.6904a.3452.3452 0 00.5447-.2268l.1903-1.1662c.088-.0456.1751-.0931.2622-.1407l1.0762.49a.3472.3472 0 00.49-.327l-.0415-1.1845a6.7267 6.7267 0 00.2267-.1863l1.1531.2713a.3472.3472 0 00.4171-.416l-.2713-1.1542c.0628-.0749.1255-.1508.1863-.2278l1.1845.0415a.3442.3442 0 00.328-.49l-.49-1.076c.0475-.0872.0951-.1742.1407-.2623l1.1662-.1893a.3483.3483 0 00.2258-.5447l-.6904-.9587.087-.2855 1.1066-.414a.3462.3462 0 00.1154-.5781l-.8656-.8079c.0101-.0972.0202-.1954.0283-.2936l1.0073-.6236a.3442.3442 0 000-.5892zm-6.7413 8.3551a.7138.7138 0 01.2986-1.396.714.714 0 11-.2997 1.396zm-.3422-2.3142a.649.649 0 00-.7715.5l-.3573 1.6685c-1.1035.501-2.3285.7795-3.6193.7795a8.7368 8.7368 0 01-3.6951-.814l-.3574-1.6684a.648.648 0 00-.7714-.499l-1.473.3158a8.7216 8.7216 0 01-.7613-.898h7.1676c.081 0 .1356-.0141.1356-.088v-2.536c0-.074-.0536-.0881-.1356-.0881h-2.0966v-1.6077h2.2677c.2065 0 1.1065.0587 1.394 1.2088.0901.3533.2875 1.5044.4232 1.8729.1346.413.6833 1.2381 1.2685 1.2381h3.5716a.7492.7492 0 00.1296-.0131 8.7874 8.7874 0 01-.8119.9526zM6.8369 20.024a.714.714 0 11-.2997-1.396.714.714 0 01.2997 1.396zM4.1177 8.9972a.7137.7137 0 11-1.304.5791.7137.7137 0 011.304-.579zm-.8352 1.9813l1.5347-.6824a.65.65 0 00.33-.8585l-.3158-.7147h1.2432v5.6025H3.5669a8.7753 8.7753 0 01-.2834-3.348zm6.7343-.5437V8.7836h2.9601c.153 0 1.0792.1772 1.0792.8697 0 .575-.7107.7815-1.2948.7815zm10.7574 1.4862c0 .2187-.008.4363-.0243.651h-.9c-.09 0-.1265.0586-.1265.1477v.413c0 .973-.5487 1.1846-1.0296 1.2382-.4576.0517-.9648-.1913-1.0275-.4717-.2704-1.5186-.7198-1.8436-1.4305-2.4034.8817-.5599 1.799-1.386 1.799-2.4915 0-1.1936-.819-1.9458-1.3769-2.3153-.7825-.5163-1.6491-.6195-1.883-.6195H5.4682a8.7651 8.7651 0 014.907-2.7699l1.0974 1.151a.648.648 0 00.9182.0213l1.227-1.1743a8.7753 8.7753 0 016.0044 4.2762l-.8403 1.8982a.652.652 0 00.33.8585l1.6178.7188c.0283.2875.0425.577.0425.8717zm-9.3006-9.5993a.7128.7128 0 11.984 1.0316.7137.7137 0 01-.984-1.0316zm8.3389 6.71a.7107.7107 0 01.9395-.3625.7137.7137 0 11-.9405.3635z"/></svg></span><span id="fname">main.rs</span><span class="x">×</span></div></div>
<div id="main"><div id="view"><div id="content"></div><div id="caret" class="blink"></div></div></div>
<div id="run"><div class="head"><span class="play">▶</span><span>Run</span><span id="runname" style="color:#8c8c8c">cargo run</span></div><pre id="out"></pre></div>
<script>
(function () {
  if (/[?&]board/.test(location.search)) document.body.classList.add("board");
  const $ = (id) => document.getElementById(id);
  const content = $("content"), view = $("view"), caretEl = $("caret");
  let LEFT = 160, WIDTH = 1740, MARGIN = 3; // MARGIN: rows kept below the caret (a short has no room to spare) // the text column's left edge, and how far the text may reach in a 1920-wide frame
  let CW = 24, LH = 64, FONT = 40;
  const slips = []; // texts that typing left different from their snapshot (a bug in the typing, shown as a jump at the end)
  let lines = [""], caret = { l: 0, c: 0 }, sel = null, scroll = 0, scrollGoal = 0, typing = false;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // ---- Rust colours, in the editor's own palette ----
  const RULES = [
    [/\/\/.*/, "cm"], [/"(?:[^"\\]|\\.)*"|b?'(?:[^'\\]|\\.)'/, "str"], [/'[a-z_]\w*\b(?!')/, "lt"], [/#!?\[[^\]]*\]/, "attr"],
    [/\b[a-z_]\w*!/, "mac"],
    [/\b(?:fn|let|mut|for|in|while|loop|if|else|match|return|use|mod|pub|static|const|struct|enum|trait|impl|where|type|ref|self|Self|crate|super|unsafe|extern|move|as|dyn|break|continue|true|false)\b/, "kw"],
    [/\b(?:i8|i16|i32|i64|i128|isize|u8|u16|u32|u64|u128|usize|f32|f64|bool|char|str|String|Vec|Option|Some|None|Box|HashMap|HashSet|Result|Ok|Err)\b/, "ty"],
    [/\b[A-Z][a-zA-Z0-9]*\b/, "ty"],
    [/\b\d[\d_]*(?:\.\d+)?(?:[iuf](?:8|16|32|64|128|size))?\b/, "num"],
  ];
  const RE = new RegExp(RULES.map(([r]) => `(${r.source})`).join("|"), "g");
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  function paint(line) {
    let out = "", last = 0, m; RE.lastIndex = 0;
    while ((m = RE.exec(line))) {
      if (!m[0]) { RE.lastIndex++; continue; }
      const k = m.slice(1).findIndex((g) => g !== undefined);
      let cls = RULES[k][1];
      out += esc(line.slice(last, m.index)) + `<span class="${cls}">${esc(m[0])}</span>`;
      last = RE.lastIndex;
    }
    out += esc(line.slice(last));
    // a name right after `fn` is a declaration
    return out.replace(/(<span class="kw">fn<\/span> )([a-z_]\w*)/g, '$1<span class="fn">$2</span>');
  }

  // ---- drawing ----
  function measure() { const s = document.createElement("span"); s.style.cssText = `position:absolute;visibility:hidden;font:400 ${FONT}px 'JetBrains Mono',Menlo,monospace`; s.textContent = "M".repeat(40); document.body.appendChild(s); CW = s.getBoundingClientRect().width / 40; s.remove(); }
  function render() {
    content.innerHTML = lines.map((t, i) => `<div class="ln${i === caret.l && !sel ? " on" : ""}"><span class="no">${i + 1}</span><span class="tx">${paint(t) || " "}</span></div>`).join("");
    if (sel) {
      const [a, b] = order(sel.a, sel.b);
      for (let l = a.l; l <= b.l; l++) {
        const c0 = l === a.l ? a.c : 0, c1 = l === b.l ? b.c : lines[l].length + 1;
        const d = document.createElement("div"); d.className = "sel";
        d.style.cssText = `left:${LEFT + c0 * CW}px;top:${l * LH}px;width:${Math.max(CW * 0.5, (c1 - c0) * CW)}px`;
        content.insertBefore(d, content.firstChild);
      }
    }
    caretEl.style.left = LEFT + caret.c * CW + "px";
    caretEl.style.top = caret.l * LH - scroll * LH + "px";
    caretEl.style.display = sel ? "none" : "";
    follow();
  }
  const order = (a, b) => (a.l < b.l || (a.l === b.l && a.c <= b.c) ? [a, b] : [b, a]);
  function rows() { return Math.floor(view.clientHeight / LH); }
  function follow() { // keep the caret two lines inside the view, like an IDE does
    const n = rows(), l = sel ? Math.max(sel.a.l, sel.b.l) : caret.l;
    if (l < scrollGoal + 1) scrollGoal = Math.max(0, l - 1);
    else if (l > scrollGoal + n - MARGIN) scrollGoal = l - n + MARGIN;
    scrollGoal = Math.max(0, Math.min(scrollGoal, Math.max(0, lines.length - n + MARGIN - 1)));
  }
  (function tick() { // scrolling eases toward its goal
    scroll += (scrollGoal - scroll) * 0.18; if (Math.abs(scrollGoal - scroll) < 0.002) scroll = scrollGoal;
    content.style.transform = `translateY(${-scroll * LH}px)`;
    caretEl.style.top = caret.l * LH - scroll * LH + "px";
    requestAnimationFrame(tick);
  })();

  // ---- editing ----
  function insert(text) {
    const before = lines[caret.l].slice(0, caret.c), after = lines[caret.l].slice(caret.c), parts = text.split("\n");
    if (parts.length === 1) { lines[caret.l] = before + text + after; caret.c += text.length; return; }
    lines.splice(caret.l, 1, before + parts[0], ...parts.slice(1, -1), parts[parts.length - 1] + after);
    caret.l += parts.length - 1; caret.c = parts[parts.length - 1].length;
  }
  function removeRange(a, b) { // a ≤ b
    const head = lines[a.l].slice(0, a.c), tail = lines[b.l].slice(b.c);
    lines.splice(a.l, b.l - a.l + 1, head + tail); caret = { l: a.l, c: a.c };
  }
  const delay = (cps) => (1000 / cps) * (0.55 + Math.random() * 0.9);
  // Brackets and quotes behave as in a real editor: typing ( [ { or " puts its closer in at the same moment, with the caret
  // between them; typing the closer steps over the one already there; Enter between { and } opens an indented line with the
  // } on the line below, and the Enter that reaches that } moves onto it instead of making a new line. Only closers this
  // typing put in are stepped over, and an opener gets its closer only if that closer is in the same typed text: code typed
  // into the middle of a file, whose } is already there below, neither eats a bracket nor leaves a spare one.
  const PAIR = { "(": ")", "[": "]", "{": "}", '"': '"' }, CLOSER = /^[)\]}"]*$/;
  function matched(text) { // the openers in text whose closer comes later in text: opener index → closer index
    const ok = new Map(), st = [];
    for (let i = 0; i < text.length; i++) {
      const ch = text[i], top = st[st.length - 1];
      if (top && text[top] === '"') { if (ch === "\\") i++; else if (ch === '"') ok.set(st.pop(), i); continue; } // inside a string
      if (ch === '"' || ch === "(" || ch === "[" || ch === "{") st.push(i);
      else if (top != null && PAIR[text[top]] === ch) ok.set(st.pop(), i);
    }
    return ok;
  }
  async function type(text, cps) {
    typing = true; caretEl.classList.remove("blink");
    const pairs = matched(text);
    const auto = []; // closers this typing put ahead of the caret, innermost last; ml: moved to a line below by an Enter
    for (let i = 0; i < text.length; i++) {
      const ch = text[i], line = lines[caret.l], rest = line.slice(caret.c), next = rest[0], top = auto[auto.length - 1];
      if (ch === "\n") { // Enter, then the editor indents the new line itself
        const ind = (text.slice(i + 1).match(/^[ \t]*/) || [""])[0], after = text[i + 1 + ind.length], below = lines[caret.l + 1];
        if (top && top.ml && after === top.c && !rest.trim() && below != null && below.trimStart()[0] === after) {
          caret = { l: caret.l + 1, c: below.length - below.trimStart().length }; // onto the closer waiting below
        } else if (top && !top.ml && next === top.c && PAIR[line[caret.c - 1]] === next && next !== '"' && after !== next) {
          const base = (text.slice(text.lastIndexOf("\n", top.at) + 1).match(/^[ \t]*/) || [""])[0]; // the } goes where its line will have it
          insert("\n" + ind + "\n" + base); caret = { l: caret.l - 1, c: ind.length }; top.ml = true; // { | } opens up
        } else insert("\n" + ind);
        i += ind.length; render(); await sleep(delay(cps) * 2.2); continue;
      }
      if (top && ch === top.c && next === ch) { caret.c++; auto.pop(); } // step over the closer already there
      else if (pairs.has(i) && CLOSER.test(rest) && rest.length <= auto.filter((x) => !x.ml).length) {
        insert(ch + PAIR[ch]); caret.c--; auto.push({ c: PAIR[ch], ml: false, at: pairs.get(i) });
      } else insert(ch);
      render();
      await sleep(delay(cps) * (/[;{}(),.]/.test(ch) ? 1.6 : ch === " " ? 1.2 : 1));
    }
    typing = false; caretEl.classList.add("blink");
  }
  async function put(text, cps, paste) { // type it, or with { paste: true } drop it in at once, like code pasted back in
    if (!paste) return type(text, cps);
    insert(text); render(); await sleep(700);
  }
  async function moveTo(l, c) { caret = { l, c }; sel = null; render(); await sleep(140); }

  // the line-level difference between two texts: equal / delete / insert runs, in order
  function diff(a, b) {
    const n = a.length, m = b.length, dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const ops = []; let i = 0, j = 0;
    while (i < n || j < m) {
      if (i < n && j < m && a[i] === b[j]) { ops.push(["=", i, j]); i++; j++; }
      else if (j < m && (i >= n || dp[i][j + 1] >= dp[i + 1][j])) { ops.push(["+", i, j]); j++; }
      else { ops.push(["-", i, j]); i++; }
    }
    // group into hunks of [first old line, removed lines, added lines]
    const hunks = []; let cur = null;
    ops.forEach(([k, i2, j2]) => {
      if (k === "=") { cur = null; return; }
      if (!cur) { cur = { at: i2, del: [], add: [] }; hunks.push(cur); }
      if (k === "-") cur.del.push(a[i2]); else cur.add.push(b[j2]);
    });
    return hunks;
  }
  async function to(text, o = {}) {
    const cps = o.cps || 22, goal = text.replace(/\s+$/, "").split("\n");
    let shift = 0;
    for (const h of diff(lines.slice(), goal)) {
      const at = h.at + shift;
      if (h.del.length === 1 && h.add.length === 1) { // one line changed: retype only the part that differs
        const o0 = h.del[0], n0 = h.add[0];
        let p = 0; while (p < o0.length && p < n0.length && o0[p] === n0[p]) p++;
        let s = 0; while (s < o0.length - p && s < n0.length - p && o0[o0.length - 1 - s] === n0[n0.length - 1 - s]) s++;
        if (o0.length - p - s > 0) { sel = { a: { l: at, c: p }, b: { l: at, c: o0.length - s } }; render(); await sleep(420); sel = null; removeRange({ l: at, c: p }, { l: at, c: o0.length - s }); render(); await sleep(120); }
        else await moveTo(at, p);
        await put(n0.slice(p, n0.length - s), cps, o.paste);
        continue;
      }
      if (h.del.length) { // select the lines that go, then delete them
        const last = at + h.del.length - 1;
        sel = { a: { l: at, c: 0 }, b: { l: last, c: lines[last].length } }; render(); await sleep(520);
        sel = null;
        if (at + h.del.length < lines.length) removeRange({ l: at, c: 0 }, { l: at + h.del.length, c: 0 });
        else if (at > 0) removeRange({ l: at - 1, c: lines[at - 1].length }, { l: last, c: lines[last].length });
        else { lines = [""]; caret = { l: 0, c: 0 }; }
        render(); await sleep(160);
        shift -= h.del.length;
      }
      if (h.add.length) { // new lines: open a line, then type them
        const where = at;
        if (where < lines.length && !(h.del.length && lines.length === 1 && lines[0] === "")) {
          if (where === 0) { await moveTo(0, 0); insert("\n"); caret = { l: 0, c: 0 }; }
          else { await moveTo(where - 1, lines[where - 1].length); insert("\n"); }
        } else if (!(lines.length === 1 && lines[0] === "")) { await moveTo(lines.length - 1, lines[lines.length - 1].length); insert("\n"); }
        const ind = (h.add[0].match(/^[ \t]*/) || [""])[0];
        lines[caret.l] = ind + lines[caret.l].replace(/^[ \t]*/, ""); caret.c = ind.length; render(); await sleep(160);
        await put(h.add.join("\n").slice(ind.length), cps, o.paste);
        shift += h.add.length;
      }
    }
    if (lines.join("\n").replace(/[ \t]+$/gm, "") !== goal.join("\n").replace(/[ \t]+$/gm, "")) slips.push(lines.join("\n")); // typed ≠ goal: studio.js reports it
    lines = goal.slice(); // the typed text and the goal are the same; this keeps any whitespace slip from accumulating

  }
  function find(textToFind, nth = 1) {
    let k = 0;
    for (let l = 0; l < lines.length; l++) {
      let from = 0, at;

    }
    return null;
  }
  window.__ed = {
    ready: () => document.fonts.ready.then(() => { measure(); render(); }),
    name(n) { $("fname").textContent = n; $("ficon").hidden = !/\.rs$/.test(n); },
    fit(cols) { // no sideways scrolling: if a line of this video is wider than the frame, shrink the font for the whole video
      const k = Math.min(1, WIDTH / (cols * 0.6 * 40)); FONT = 40 * k; LH = Math.round(64 * k);
      const r = document.documentElement.style; r.setProperty("--font", FONT + "px"); r.setProperty("--lh", LH + "px");
      caretEl.style.height = Math.round(50 * k) + "px"; caretEl.style.marginTop = Math.round(7 * k) + "px";
      measure(); render(); return FONT;
    },
    short() { // the 1080-wide frame: a narrower gutter, and a font that fits about 40 columns
      document.body.classList.add("short"); LEFT = 96; WIDTH = 1080 - LEFT - 40; FONT = 35; LH = 51; MARGIN = 1;
      const r = document.documentElement.style; r.setProperty("--left", LEFT + "px"); r.setProperty("--font", FONT + "px"); r.setProperty("--lh", LH + "px");
      caretEl.style.height = "42px"; caretEl.style.marginTop = "6px"; measure(); render();
    },
    side(src, w) { // the chapter page beside the code: the text column narrows to the rest of the frame
      const r = document.documentElement.style, old = $("side");
      if (old) old.remove();
      if (!src) { document.body.classList.remove("side"); document.body.style.paddingLeft = ""; LEFT = 160; WIDTH = 1740; r.setProperty("--left", LEFT + "px"); measure(); render(); return Promise.resolve(false); }
      document.body.classList.add("side"); document.body.style.paddingLeft = w + "px";
      LEFT = 116; WIDTH = innerWidth - w - LEFT - 36; r.setProperty("--left", LEFT + "px"); measure(); render();
      return new Promise((done) => {
        const f = document.createElement("iframe"); f.id = "side"; f.style.width = w + "px";
        f.onload = () => done(true); f.src = src; document.body.appendChild(f);
      });
    },
    set(text) { lines = text.replace(/\s+$/, "").split("\n"); caret = { l: lines.length - 1, c: lines[lines.length - 1].length }; sel = null; scroll = scrollGoal = 0; render(); },
    to,
    get typing() { return typing; },
    get slips() { return slips.slice(); },
    caretTo(textToFind, nth) { const p = find(textToFind, nth); if (p) { caret = { l: p.l, c: p.c + textToFind.length }; sel = null; render(); } return !!p; },
    select(textToFind, nth) { const p = find(textToFind, nth); if (!p) return false; sel = { a: p, b: { l: p.l, c: p.c + textToFind.length } }; render(); return true; },
    selectLines(a, b) { sel = { a: { l: a - 1, c: 0 }, b: { l: b - 1, c: lines[b - 1].length } }; render(); },
    unselect() { sel = null; render(); },
    async run(cmd, out, ok) {
      $("runname").textContent = cmd || "cargo run";
      const compileError = /^error/.test(out); const pre = $("out"); pre.innerHTML = `<span class="dim">$ ${esc(cmd || "cargo run")}</span>\n`;
      $("run").classList.toggle("tall", !ok || out.trim().split("\n").length > 5); // a long output gets the room an error gets
      if (document.body.classList.contains("short")) { // a short: a program's whole output fits, up to 15 lines; a compile error shows its first lines
        const n = out.trim().split("\n").length + 1, small = !compileError && n > 6;
        $("out").style.fontSize = small ? "24px" : ""; $("run").style.height = compileError || n <= 4 ? "" : Math.min(640, 66 + n * (small ? 35 : 41)) + "px";
      }

      // its own output stays plain, and only the panic (from "thread 'main' panicked" on) is red
      const lines = out.replace(/\s+$/, "").split("\n");

      const cls = (i) => compileError ? "err" : i <= warnEnd ? "warn" : panicAt >= 0 ? (i >= panicAt ? "err" : "") : ok ? "" : "err";
      for (const [i, line] of lines.entries()) { pre.innerHTML += `<span class="${cls(i)}">${esc(line)}</span>\n`; if (!compileError) pre.scrollTop = pre.scrollHeight; await sleep(60); } // a program's output follows its newest line, like a terminal; a compiler error keeps its first line, the one that names it
    },
    close() { $("run").classList.remove("open"); setTimeout(follow, 350); },
  };
})();
</script>
